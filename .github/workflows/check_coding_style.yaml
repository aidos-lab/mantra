name: Check and enforce coding style via `black`

on: [ push, pull_request ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install black==26.10.1
      - run: python -m black --check --verbose --exclude docs/ --target-version py312 .

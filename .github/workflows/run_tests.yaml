name: Run tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported (requires-python) and the version used locally.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync

      # We drive coverage through `coverage run -m pytest` rather than the
      # pytest-cov plugin: starting pytest-cov before torch is imported
      # trips a torch/coverage bug ("function '_has_torch_function' already
      # has a docstring"). Plain `coverage run` avoids it.
      - name: Run tests with coverage
        run: |
          uv run coverage run -m pytest
          uv run coverage report
